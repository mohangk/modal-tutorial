[project]
name = "demoscener-learning"
version = "0.1.0"
description = "Local inference experiments connecting Demoscener to RL basics"
requires-python = ">=3.12,<3.15"
dependencies = [
    "accelerate>=1,<2",
    "huggingface-hub>=1,<3",
    "peft>=0.21.2,<0.22",
    "torch>=2.10,<3",
    "transformers==5.22.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
